services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: projectfit-backend:latest
    container_name: projectfit-api
    ports:
      - "${PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      PORT: "3001"
      HOST: 0.0.0.0
      # Kill switches — set to "false" to disable a component (see README).
      ENABLE_HYBRID: ${ENABLE_HYBRID:-true}
      ENABLE_DEVIL: ${ENABLE_DEVIL:-true}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
